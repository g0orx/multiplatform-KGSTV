[package]
name = "kgstv-gui"
version = "0.1.0"
edition = "2021"
description = "KG-STV desktop interface (egui/eframe based, Windows/Linux/macOS)."
license = "MIT OR Apache-2.0"

[dependencies]
eframe = "0.36.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
kgstv-core = { path = "../kgstv-core" }
kgstv-modem = { path = "../kgstv-modem" }
rfd = "0.17.2"
